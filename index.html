<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    </head>

    <body>
        <div id="app">
            <div id="canvas-container">
                <canvas id='canvas'></canvas>
            </div>

            <div id="sidebar">
                <div id="inputs">
                    <div class="matrix-inputs">
                        <input type="number" step="any" class="entry" id="t11" value="1">
                        <input type="number" step="any" class="entry" id="t12" value="0">
                        <input type="number" step="any" class="entry" id="t13" value="0">
                        <input type="number" step="any" class="entry" id="t21" value="0">
                        <input type="number" step="any" class="entry" id="t22" value="1">
                        <input type="number" step="any" class="entry" id="t23" value="0">
                        <input type="number" step="any" class="entry" id="t31" value="0">
                        <input type="number" step="any" class="entry" id="t32" value="0">
                        <input type="number" step="any" class="entry" id="t33" value="1">
                    </div>

                    <div class="vector-inputs">
                        <input type="number" step="any" class="entry" id="v1" value="1">
                        <input type="number" step="any" class="entry" id="v2" value="1">
                        <input type="number" step="any" class="entry" id="v3" value="1">
                    </div>
                </div>

                <div id="formula-container"></div>

                <div id="controls">
                    <button id="replay">Replay</button>
                    <label>
                        <input type="checkbox" id="toggle-lattice" checked>
                        Show transforming grid
                    </label>
                    <label>
                        <input type="checkbox" id="toggle-basis" checked>
                        Show basis vectors
                    </label>
                </div>
                <label>
                    Rotation
                    <div id="rotation-controls">
                        <label>X axis: </label>
                        <input type="range" id="x-rotation" min="-180" max="180" value="0" step="1">
                        <span id="x-rotation-label">0°</span>
                        <label>Y axis: </label>
                        <input type="range" id="y-rotation" min="-180" max="180" value="0" step="1">
                        <span id="y-rotation-label">0°</span>
                        <label>Z axis: </label>
                        <input type="range" id="z-rotation" min="-180" max="180" value="0" step="1">
                        <span id="z-rotation-label">0°</span>
                    </div>
                </label>
                <label>
                    Scale
                    <div id="scale-controls">
                        <label>X axis: </label>
                        <input type="range" id="x-scale" min="-5" max="5" value="1" step="0.1">
                        <span id="x-scale-label">1</span>
                        <label>Y axis: </label>
                        <input type="range" id="y-scale" min="-5" max="5" value="1" step="0.1">
                        <span id="y-scale-label">1</span>
                        <label>Z axis: </label>
                        <input type="range" id="z-scale" min="-5" max="5" value="1" step="0.1">
                        <span id="z-scale-label">1</span>
                    </div>
                </label>
            </div>

        </div>

        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
        <script type="module" src="3app.js"></script>
        
    </body>

</html>
